name: Feature request
description: Propose a change in scope or behavior.
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        The dashboard is loopback-only and single-user by design (plan §10). Requests for public
        or multi-user access, provider writes, or billing actions are out of scope.
