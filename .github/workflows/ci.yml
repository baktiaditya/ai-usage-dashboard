name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether the code suites are needed
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "${{ github.base_ref }}"
          changed=$(git diff --no-renames --name-only "origin/${{ github.base_ref }}...HEAD")
          printf 'Changed files:\n%s\n' "$changed"
          # Fail closed: only a recognisably documentation-only diff skips the code
          # suites. `--no-renames` keeps a move out of a code path visible as a
          # delete plus an add, and the extension check keeps a code file under a
          # documentation directory from passing as documentation.
          code=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.md|LICENSE|.gitignore|*.gitkeep) continue ;;
            esac
            case "$file" in
              docs/*|.agents/*|.claude/*|.vscode/*)
                case "$file" in
                  *.mdx|*.txt|*.yaml|*.yml|*.json|*.svg|*.png|*.jpg|*.jpeg|*.gif|*.webp|*.ico|*.avif) continue ;;
                esac
                ;;
            esac
            code=true
          done <<< "$changed"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  verify:
    name: pnpm run verify
    needs: changes
    # Run even when `changes` fails, so the required check still reports.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Use the Node version from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm through corepack
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate the OKF documentation bundle
        run: python3 .agents/skills/okf-sync/scripts/validate_okf_bundle.py

      # A documentation-only diff cannot fail the runtime suites, so Prettier
      # and the bundle validator are the checks that still apply to it. Both
      # steps fail closed: an unrecognised or missing `code` value runs the
      # full suite.
      - name: Prettier check (documentation-only diff)
        if: needs.changes.outputs.code == 'false'
        run: pnpm run format:check

      - name: Format, lint, typecheck, unit and integration tests
        if: needs.changes.outputs.code != 'false'
        run: pnpm run verify

  verify-macos:
    name: pnpm run verify (macOS 15 ARM64)
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: macos-15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Use the Node version from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm through corepack
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Proves Darwin code and test behavior, including the launchd renderer and
      # installer integration tests. GUI login-session launchd lifecycle proof
      # stays on the real-Mac harness (scripts/test-launchd.sh).
      - name: Format, lint, typecheck, unit and integration tests
        run: pnpm run verify

  installation-systemd:
    name: disposable-systemd installation rehearsal
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Allow unprivileged user namespaces on this image
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces through
          # AppArmor. A user manager cannot apply the units' sandbox without
          # them and fails with status=218/CAPABILITIES. This is runner
          # provisioning, not product behavior.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 2>/dev/null || true
          sudo sysctl -w user.max_user_namespaces=10000 2>/dev/null || true

      - name: Create the disposable account with its own user manager
        run: |
          sudo useradd --create-home --shell /bin/bash audrehearsal
          sudo loginctl enable-linger audrehearsal
          uid=$(id -u audrehearsal)
          # A real login session is what starts the account's user manager:
          # linger alone does not on this image. sudo -i goes through PAM,
          # so pam_systemd creates /run/user/<uid> and user@<uid>.service.
          for _ in $(seq 1 30); do
            if sudo -iu audrehearsal env XDG_RUNTIME_DIR="/run/user/$uid" \
              systemctl --user show-environment >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "user manager did not become reachable" >&2
          exit 1

      - name: Hand the checkout to the disposable account
        run: |
          sudo cp -a "$GITHUB_WORKSPACE" /tmp/aud-rehearsal-source
          sudo chown -R audrehearsal:audrehearsal /tmp/aud-rehearsal-source

      - name: Run the real install, update, recovery, uninstall, and reinstall rehearsal
        run: |
          uid=$(id -u audrehearsal)
          cat >/tmp/aud-rehearsal-run.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          export HOME=/home/audrehearsal
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          # The runner image exports XDG paths pointing at the runner account;
          # keep every XDG base inside the disposable home so pnpm and Corepack
          # never read a config they cannot access.
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_CACHE_HOME="$HOME/.cache"
          export XDG_DATA_HOME="$HOME/.local/share"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$XDG_DATA_HOME"
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          export AUD_INSTALL_SYSTEMD_REHEARSAL=1
          export AUD_INSTALL_REHEARSAL_SOURCE=/tmp/aud-rehearsal-source
          env | grep -E '^(HOME|XDG_|PNPM|NPM_|COREPACK)' | sort
          exec bash /tmp/aud-rehearsal-source/scripts/test-installation-systemd.sh
          SCRIPT
          chmod 0755 /tmp/aud-rehearsal-run.sh
          sudo -iu audrehearsal /tmp/aud-rehearsal-run.sh
