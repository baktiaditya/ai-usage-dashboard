name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: pnpm run verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Use the Node version from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm through corepack
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format, lint, typecheck, unit and integration tests
        run: pnpm run verify

  installation-systemd:
    name: disposable-systemd installation rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Create the disposable account with its own user manager
        run: |
          sudo useradd --create-home --shell /bin/bash audrehearsal
          sudo loginctl enable-linger audrehearsal
          uid=$(id -u audrehearsal)
          wait_for_manager() {
            for _ in $(seq 1 60); do
              [[ -S "/run/user/$uid/systemd/private" ]] && return 0
              sleep 1
            done
            return 1
          }
          if ! wait_for_manager; then
            # Linger did not bring the manager up by itself on this image;
            # start the same units systemd-logind would start for a session.
            sudo systemctl start "user-runtime-dir@$uid.service" || true
            sudo systemctl start "user@$uid.service" || true
            wait_for_manager
          fi
          sudo -u audrehearsal env XDG_RUNTIME_DIR="/run/user/$uid" \
            systemctl --user show-environment >/dev/null

      - name: Hand the checkout to the disposable account
        run: |
          sudo cp -a "$GITHUB_WORKSPACE" /tmp/aud-rehearsal-source
          sudo chown -R audrehearsal:audrehearsal /tmp/aud-rehearsal-source

      - name: Run the real install, update, recovery, uninstall, and reinstall rehearsal
        run: |
          uid=$(id -u audrehearsal)
          cat >/tmp/aud-rehearsal-run.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          export HOME=/home/audrehearsal
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          export AUD_INSTALL_SYSTEMD_REHEARSAL=1
          export AUD_INSTALL_REHEARSAL_SOURCE=/tmp/aud-rehearsal-source
          exec bash /tmp/aud-rehearsal-source/scripts/test-installation-systemd.sh
          SCRIPT
          chmod 0755 /tmp/aud-rehearsal-run.sh
          sudo -u audrehearsal /tmp/aud-rehearsal-run.sh
