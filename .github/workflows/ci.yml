name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: pnpm run verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Use the Node version from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm through corepack
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format, lint, typecheck, unit and integration tests
        run: pnpm run verify

  installation-systemd:
    name: disposable-systemd installation rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Allow unprivileged user namespaces on this image
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces through
          # AppArmor. A user manager cannot apply the units' sandbox without
          # them and fails with status=218/CAPABILITIES. This is runner
          # provisioning, not product behavior.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 2>/dev/null || true
          sudo sysctl -w user.max_user_namespaces=10000 2>/dev/null || true

      - name: Create the disposable account with its own user manager
        run: |
          sudo useradd --create-home --shell /bin/bash audrehearsal
          sudo loginctl enable-linger audrehearsal
          uid=$(id -u audrehearsal)
          # A real login session is what starts the account's user manager:
          # linger alone does not on this image. sudo -i goes through PAM,
          # so pam_systemd creates /run/user/<uid> and user@<uid>.service.
          for _ in $(seq 1 30); do
            if sudo -iu audrehearsal env XDG_RUNTIME_DIR="/run/user/$uid" \
              systemctl --user show-environment >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "user manager did not become reachable" >&2
          exit 1

      - name: Hand the checkout to the disposable account
        run: |
          sudo cp -a "$GITHUB_WORKSPACE" /tmp/aud-rehearsal-source
          sudo chown -R audrehearsal:audrehearsal /tmp/aud-rehearsal-source

      - name: Run the real install, update, recovery, uninstall, and reinstall rehearsal
        run: |
          uid=$(id -u audrehearsal)
          cat >/tmp/aud-rehearsal-run.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          export HOME=/home/audrehearsal
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          # The runner image exports XDG paths pointing at the runner account;
          # keep every XDG base inside the disposable home so pnpm and Corepack
          # never read a config they cannot access.
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_CACHE_HOME="$HOME/.cache"
          export XDG_DATA_HOME="$HOME/.local/share"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$XDG_DATA_HOME"
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          export AUD_INSTALL_SYSTEMD_REHEARSAL=1
          export AUD_INSTALL_REHEARSAL_SOURCE=/tmp/aud-rehearsal-source
          env | grep -E '^(HOME|XDG_|PNPM|NPM_|COREPACK)' | sort
          exec bash /tmp/aud-rehearsal-source/scripts/test-installation-systemd.sh
          SCRIPT
          chmod 0755 /tmp/aud-rehearsal-run.sh
          sudo -iu audrehearsal /tmp/aud-rehearsal-run.sh
